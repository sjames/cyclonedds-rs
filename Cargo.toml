[workspace]
members = ["cyclonedds", "cyclonedds-sys", "cyclonedds-derive"]
resolver = "2"

[workspace.package]
edition = "2021"
description = "Rust bindings for cyclonedds autogenerated by bindgen"
homepage = "https://github.com/uzuna/cyclonedds-sys"
license-file = "LICENSE"
rust-version = "1.94"

[workspace.dependencies]
cyclonedds-sys = { path = "cyclonedds-sys" }
cyclonedds-derive = { path = "cyclonedds-derive" }
